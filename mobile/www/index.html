<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>مهرپل</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: Tahoma, sans-serif; background: #fbf6ee; color: #1d2321; text-align: center; padding: 24px; box-sizing: border-box; }
    img { width: 84px; height: 84px; border-radius: 22px; }
    h1 { font-size: 20px; margin: 18px 0 8px; }
    p { color: #66706c; line-height: 1.9; margin: 0 0 20px; }
    button { font: inherit; font-weight: bold; border: 0; border-radius: 14px; padding: 12px 28px; background: #0f6e5c; color: #fff; }
  </style>
</head>
<body>
  <main>
    <img src="icon.png" alt="">
    <h1>اتصال برقرار نشد</h1>
    <p>اینترنت گوشی را بررسی کنید و دوباره تلاش کنید.</p>
    <button onclick="location.reload()">تلاش دوباره</button>
  </main>
</body>
</html>

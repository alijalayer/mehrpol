name: android
# Builds the Android app. Run it from the Actions tab → android → Run workflow,
# enter your server address, then download the APK from the run's Artifacts
# (or tick "release" to also publish it on the Releases page for easy install).
on:
  workflow_dispatch:
    inputs:
      server_url:
        description: 'Server address the app opens (e.g. https://mehrpol.ir or http://192.168.1.5:3000 for a Wi-Fi demo)'
        required: true
      version_name:
        description: 'Version shown to users'
        default: '1.0.0'
      release:
        description: 'Also publish the APK on the Releases page'
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: node scripts/android-config.js "${{ inputs.server_url }}"
      - run: npx cap sync android
      - name: Decode signing key (only when the repository secret is set)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi
      - name: Build APK
        working-directory: android
        env:
          APP_VERSION_CODE: ${{ github.run_number }}
          APP_VERSION_NAME: ${{ inputs.version_name }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ -n "$ANDROID_KEYSTORE_PATH" ]; then ./gradlew assembleRelease; else ./gradlew assembleDebug; fi
      - uses: actions/upload-artifact@v4
        with:
          name: mehrpol-android-${{ inputs.version_name }}
          path: android/app/build/outputs/apk/**/*.apk
      - name: Publish on the Releases page
        if: inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version_name }}
          SERVER_URL: ${{ inputs.server_url }}
        run: |
          cp "$(find android/app/build/outputs/apk -name '*.apk' | head -1)" "mehrpol-$VERSION.apk"
          gh release create "v$VERSION" "mehrpol-$VERSION.apk" --prerelease --target "$GITHUB_SHA"             --title "مهرپل $VERSION (نسخهٔ آزمایشی)"             --notes "نسخهٔ آزمایشی اندروید. این نسخه به سرور $SERVER_URL وصل می‌شود.

          نصب: فایل mehrpol-$VERSION.apk را روی گوشی دانلود کنید، بازش کنید و اجازهٔ «نصب از منابع ناشناس» را بدهید."

<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>درگاه پرداخت آزمایشی</title>
  <link rel="stylesheet" href="/css/app.css">
  <script type="module" src="/js/mock-gateway.js"></script>
</head>
<body class="gateway-body">
  <div class="gateway card">
    <div class="gateway-badge">درگاه آزمایشی — پولی جابه‌جا نمی‌شود</div>
    <h1>پرداخت اینترنتی</h1>
    <p class="muted">در نسخهٔ واقعی، اینجا صفحهٔ درگاه بانک (شاپرک) نمایش داده می‌شود.</p>
    <div class="gateway-amount"><span class="muted">مبلغ قابل پرداخت</span><strong id="amount">…</strong></div>
    <button class="btn btn-primary btn-block btn-lg" id="pay">پرداخت موفق (شبیه‌سازی)</button>
    <button class="btn btn-ghost btn-block" id="cancel">انصراف از پرداخت</button>
  </div>
</body>
</html>
